<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>NOVA — Acceso privado</title>
  <meta name="description" content="Acceso seguro al contenido oficial de NOVA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="gate-page">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="NOVA inicio">
      <span class="brand-mark">N</span><span>NOVA</span>
    </a>
    <span class="secure-pill"><span class="status-dot"></span> Conexión segura</span>
  </header>

  <main class="gate-wrap">
    <section class="gate-card" aria-labelledby="gate-title">
      <div class="eyebrow">ACCESO OFICIAL</div>
      <h1 id="gate-title">Antes de continuar</h1>
      <p class="lead">Este sitio contiene material destinado exclusivamente a personas mayores de edad.</p>

      <div class="age-badge" aria-hidden="true">+18</div>

      <label class="check-row">
        <input id="age-check" type="checkbox">
        <span class="custom-check"></span>
        <span>Confirmo que tengo 18 años o más y acepto los <a href="#terms">términos de acceso</a>.</span>
      </label>

      <button id="continue-btn" class="primary-btn" disabled>
        Confirmar y continuar <span aria-hidden="true">→</span>
      </button>
      <button id="leave-btn" class="text-btn">No soy mayor de edad</button>

      <div class="trust-row">
        <span>SSL protegido</span><span class="separator">•</span><span>Redirección verificada</span><span class="separator">•</span><span>Privacidad</span>
      </div>
    </section>

    <p class="demo-note">Demo interactiva · <a href="admin.html">Abrir panel de gestión</a></p>
  </main>

  <div id="redirect-overlay" class="redirect-overlay" aria-hidden="true">
    <div class="loader"></div>
    <strong>Acceso confirmado</strong>
    <span>Redirigiendo al destino seguro…</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
